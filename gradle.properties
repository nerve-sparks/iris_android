# Samsung Galaxy S24 Ultra Optimized Gradle Configuration
# Enhanced settings for Snapdragon 8 Gen 3 development

# JVM optimizations for Samsung Galaxy S24 Ultra development
org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -XX:+UseStringDeduplication

# Samsung Galaxy S24 Ultra build performance optimizations
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.unsafe.configuration-cache=true

# Android optimizations for Samsung devices
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.enableR8.fullMode=true

# Kotlin optimizations for Snapdragon 8 Gen 3
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.build.report.output=file

# Samsung Galaxy S24 Ultra specific optimizations
android.suppressUnsupportedCompileSdk=35
android.experimental.enableArtProfiles=true
android.experimental.r8.dex-startup-optimization=true

# Compose compiler optimizations
android.enableComposeCompilerReports=false
android.enableComposeCompilerMetrics=false

# Samsung AMOLED and performance optimizations

# Build optimization flags
org.gradle.workers.max=8
kotlin.compiler.execution.strategy=in-process
