<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Matrix AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
<style>
:root {
  --bg:        #070712;
  --surface:   #0e0e1f;
  --card:      #13132b;
  --border:    #1e1e42;
  --border2:   #2a2a5a;
  --accent:    #6366f1;
  --accent2:   #818cf8;
  --cyan:      #22d3ee;
  --green:     #10b981;
  --amber:     #f59e0b;
  --red:       #f43f5e;
  --text:      #e2e8f0;
  --muted:     #64748b;
  --muted2:    #94a3b8;
  --radius:    10px;
  --radius-sm: 6px;
  --mono:      'JetBrains Mono', 'Courier New', monospace;
  --sans:      'Inter', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}

/* ── LAYOUT ── */
.app{display:grid;grid-template-rows:52px 1fr;grid-template-columns:300px 1fr 340px;height:100vh;gap:0}
.header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);z-index:10}
.sidebar-l{grid-row:2;grid-column:1;display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);overflow:hidden}
.center{grid-row:2;grid-column:2;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.sidebar-r{grid-row:2;grid-column:3;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow:hidden}

/* ── HEADER ── */
.logo{font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--cyan);display:flex;align-items:center;gap:8px}
.logo svg{width:22px;height:22px}
.status-badge{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted2)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-dot.running{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.2s infinite}
.status-dot.done{background:var(--green)}
.status-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── SIDEBAR LEFT ── */
.sl-section{padding:14px 14px 0;display:flex;flex-direction:column;gap:10px}
.sl-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.idea-textarea{width:100%;min-height:130px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--sans);font-size:13px;padding:10px;resize:vertical;outline:none;transition:.2s}
.idea-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(99,102,241,.18)}
.run-btn{width:100%;padding:11px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--accent),var(--cyan));color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.run-btn:hover{filter:brightness(1.15)}
.run-btn:disabled{opacity:.4;cursor:not-allowed}
.run-btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Run history */
.run-list{flex:1;overflow-y:auto;padding:8px 8px 14px;display:flex;flex-direction:column;gap:6px}
.run-item{padding:9px 11px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;transition:.15s;position:relative}
.run-item:hover{border-color:var(--border2)}
.run-item.active{border-color:var(--accent);background:rgba(99,102,241,.08)}
.run-item-goal{font-size:12px;color:var(--text);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-item-meta{display:flex;gap:8px;margin-top:4px;align-items:center}
.run-item-id{font-family:var(--mono);font-size:10px;color:var(--muted)}
.run-chip{font-size:10px;padding:1px 7px;border-radius:20px;font-weight:500}
.run-chip.running{background:rgba(245,158,11,.15);color:var(--amber)}
.run-chip.done{background:rgba(16,185,129,.15);color:var(--green)}
.run-chip.error{background:rgba(244,63,94,.15);color:var(--red)}

/* ── CENTER: PIPELINE ── */
.pipeline-area{padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.section-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* Pipeline graph */
.pipeline-graph{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding-bottom:6px}
.pipeline-phase{display:flex;flex-direction:column;align-items:center;gap:4px}
.phase-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px;font-weight:600}
.phase-nodes{display:flex;flex-direction:column;gap:8px}
.phase-connector{display:flex;align-items:center;padding:0 8px;margin-top:30px;color:var(--border2);font-size:16px}

.agent-node{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:10px 14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  min-width:90px;
  transition:.25s;
  position:relative;
  cursor:default;
}
.agent-node.running{
  border-color:var(--amber);
  box-shadow:0 0 16px rgba(245,158,11,.25);
  animation:glow-amber 1.5s ease-in-out infinite alternate;
}
.agent-node.done{border-color:var(--green);box-shadow:0 0 10px rgba(16,185,129,.2)}
.agent-node.error{border-color:var(--red);box-shadow:0 0 10px rgba(244,63,94,.2)}
@keyframes glow-amber{from{box-shadow:0 0 8px rgba(245,158,11,.2)}to{box-shadow:0 0 22px rgba(245,158,11,.4)}}

.agent-icon{font-size:22px;line-height:1}
.agent-name{font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.04em;text-align:center}
.agent-status-dot{width:7px;height:7px;border-radius:50%;background:var(--border2);transition:.3s}
.agent-node.running .agent-status-dot{background:var(--amber);animation:pulse 1s infinite}
.agent-node.done .agent-status-dot{background:var(--green)}
.agent-node.error .agent-status-dot{background:var(--red)}
.agent-elapsed{font-size:9px;color:var(--muted);font-family:var(--mono)}

/* Stats bar */
.stats-bar{display:flex;gap:20px;padding:8px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.stat-val{font-size:18px;font-weight:700;color:var(--cyan);font-family:var(--mono)}
.stat-key{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* ── LOG STREAM ── */
.log-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.log-header{padding:8px 20px;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.log-scroll{flex:1;overflow-y:auto;padding:8px 12px;font-family:var(--mono);font-size:12px;line-height:1.7}
.log-entry{display:flex;gap:8px;align-items:baseline;padding:1px 0}
.log-ts{color:var(--muted);font-size:10px;flex-shrink:0}
.log-agent{flex-shrink:0;padding:1px 7px;border-radius:20px;font-size:10px;font-weight:500}
.log-msg{color:var(--muted2);word-break:break-all}
.log-entry.artifact .log-msg{color:var(--cyan)}
.log-entry.agent_start .log-msg{color:var(--accent2);font-weight:500}
.log-entry.agent_done.ok .log-msg{color:var(--green)}
.log-entry.agent_done.error .log-msg{color:var(--red)}

/* Agent badge colors */
.badge-producer{background:rgba(99,102,241,.2);color:#a5b4fc}
.badge-architect{background:rgba(34,211,238,.15);color:#67e8f9}
.badge-code{background:rgba(16,185,129,.15);color:#6ee7b7}
.badge-design{background:rgba(244,114,182,.15);color:#f9a8d4}
.badge-audio{background:rgba(251,191,36,.15);color:#fde68a}
.badge-security{background:rgba(244,63,94,.15);color:#fca5a5}
.badge-qa{background:rgba(167,139,250,.15);color:#c4b5fd}

/* ── SIDEBAR RIGHT: ARTIFACTS ── */
.artifact-header{padding:12px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.artifact-list{flex:1;overflow-y:auto;padding:8px}
.artifact-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:.15s;color:var(--muted2)}
.artifact-item:hover{background:var(--card);color:var(--text)}
.artifact-item.active{background:rgba(99,102,241,.12);color:var(--accent2)}
.artifact-icon{font-size:14px;flex-shrink:0}
.artifact-name{font-size:12px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.artifact-size{font-size:10px;color:var(--muted);flex-shrink:0}
.artifact-divider{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 10px 4px;font-weight:600}

/* File preview */
.file-preview{height:40%;border-top:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.preview-header{padding:8px 14px;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0}
.preview-filename{font-family:var(--mono);font-size:11px;color:var(--muted2);flex:1;overflow:hidden;text-overflow:ellipsis}
.preview-body{flex:1;overflow-y:auto;background:var(--bg)}
.preview-body pre{margin:0;font-size:11px;line-height:1.6;padding:10px}
.preview-body img{max-width:100%;padding:8px}
.preview-body audio{width:100%;padding:8px}
.preview-placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12px;flex-direction:column;gap:8px}
.preview-placeholder svg{opacity:.3}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ── EMPTY STATE ── */
.empty-pipeline{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--muted)}
.empty-pipeline svg{opacity:.2}
.empty-pipeline p{font-size:13px}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border2);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:100;animation:fadein .3s ease;max-width:300px}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">

  <!-- ── HEADER ── -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
      </svg>
      AI STUDIO
    </div>
    <div class="status-badge">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Ready</span>
    </div>
  </header>

  <!-- ── LEFT SIDEBAR ── -->
  <aside class="sidebar-l">
    <div class="sl-section">
      <div class="sl-label">Your Idea</div>
      <textarea id="idea" class="idea-textarea" placeholder="Describe your idea in any language…&#10;&#10;Example: create a safe Android app for storing passwords and photos, which can only be unlocked by whistling a specific melody"></textarea>
      <button id="run-btn" class="run-btn" onclick="startRun()">
        <span id="btn-icon">▶</span>
        <span id="btn-label">Run Pipeline</span>
      </button>
    </div>
    <div style="padding:12px 14px 6px;margin-top:8px">
      <div class="sl-label">Run History</div>
    </div>
    <div class="run-list" id="run-list"></div>
  </aside>

  <!-- ── CENTER ── -->
  <main class="center">

    <!-- Pipeline graph -->
    <div class="pipeline-area">
      <div class="section-title">Pipeline</div>
      <div class="pipeline-graph" id="pipeline-graph">
        <div class="empty-pipeline" style="width:100%;height:80px">
          <p>Start a run to see the pipeline</p>
        </div>
      </div>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="stats-bar" style="display:none">
      <div class="stat"><span class="stat-val" id="stat-files">0</span><span class="stat-key">Files</span></div>
      <div class="stat"><span class="stat-val" id="stat-agents">0</span><span class="stat-key">Agents</span></div>
      <div class="stat"><span class="stat-val" id="stat-time">—</span><span class="stat-key">Time</span></div>
      <div class="stat"><span class="stat-val" id="stat-status">—</span><span class="stat-key">Status</span></div>
    </div>

    <!-- Log stream -->
    <div class="log-area">
      <div class="log-header">
        <div class="section-title" style="margin-bottom:0;flex:1">Live Log</div>
        <button onclick="clearLogs()" style="background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 10px;border-radius:20px;cursor:pointer">Clear</button>
      </div>
      <div class="log-scroll" id="log-scroll">
        <div style="color:var(--muted);font-size:12px;padding:20px;text-align:center">Logs will appear here when you run the pipeline.</div>
      </div>
    </div>

  </main>

  <!-- ── RIGHT SIDEBAR ── -->
  <aside class="sidebar-r">
    <div class="artifact-header">
      <div class="sl-label" style="margin-bottom:4px">Artifacts</div>
      <div style="font-size:11px;color:var(--muted)" id="artifact-count">No files yet</div>
    </div>
    <div class="artifact-list" id="artifact-list">
      <div style="color:var(--muted);font-size:12px;padding:20px;text-align:center">Generated files appear here.</div>
    </div>
    <div class="file-preview" id="file-preview">
      <div class="preview-header">
        <span class="preview-filename" id="preview-filename">No file selected</span>
      </div>
      <div class="preview-body" id="preview-body">
        <div class="preview-placeholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
          <p>Click a file to preview</p>
        </div>
      </div>
    </div>
  </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-kotlin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>
<script>

// ═══════════════════════════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════════════════════════
let currentRunId = null;
let currentEs = null;       // EventSource
let agentStates = {};       // name → {status, elapsed}
let artifacts = [];         // [{path, name, size, ext}]
let statFiles = 0;
let statAgents = 0;
let runStart = null;
let timerInterval = null;

const PIPELINE_DEF = [
  { id:'ProducerAgent',  icon:'🎬', label:'Producer',  phase:0, badgeClass:'badge-producer' },
  { id:'ArchitectAgent', icon:'🧱', label:'Architect', phase:1, badgeClass:'badge-architect' },
  { id:'CodeAgent',      icon:'👨‍💻', label:'Code',      phase:2, badgeClass:'badge-code'     },
  { id:'DesignAgent',    icon:'🎨', label:'Design',    phase:2, badgeClass:'badge-design'   },
  { id:'AudioAgent',     icon:'🔊', label:'Audio',     phase:2, badgeClass:'badge-audio'    },
  { id:'SecurityAgent',  icon:'🔐', label:'Security',  phase:2, badgeClass:'badge-security' },
  { id:'QAAgent',        icon:'🧪', label:'QA',        phase:3, badgeClass:'badge-qa'       },
];

const EXT_ICON = { '.kt':'🟣', '.py':'🐍', '.json':'📋', '.md':'📝', '.xml':'🔷', '.gradle':'🔧', '.txt':'📄', '.png':'🖼️', '.jpg':'🖼️', '.mp3':'🎵', '.wav':'🎵', '.html':'🌐', '.js':'🟡', default:'📄' };
const EXT_LANG = { '.kt':'kotlin', '.py':'python', '.json':'json', '.xml':'xml', '.html':'markup', '.js':'javascript', '.ts':'typescript', '.gradle':'kotlin' };

// ═══════════════════════════════════════════════════════════════════════════
//  API
// ═══════════════════════════════════════════════════════════════════════════
const api = {
  async startRun(goal){ const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({goal})}); if(!r.ok) throw new Error(await r.text()); return r.json(); },
  async getRuns(){ const r=await fetch('/api/runs'); return r.json(); },
  async getArtifacts(runId){ const r=await fetch(`/api/artifacts/${runId}`); return r.json(); },
  async getArtifact(path){ const r=await fetch(`/api/artifact?path=${encodeURIComponent(path)}`); if(!r.ok) return null; return r.json(); },
};

// ═══════════════════════════════════════════════════════════════════════════
//  Run management
// ═══════════════════════════════════════════════════════════════════════════
async function startRun(){
  const goal = document.getElementById('idea').value.trim();
  if(!goal){ toast('Please enter your idea first','amber'); return; }
  setRunBtn(true);
  try{
    const {run_id} = await api.startRun(goal);
    currentRunId = run_id;
    resetState();
    runStart = Date.now();
    startTimer();
    setStatus('running','Running pipeline…');
    renderPipeline([]);
    connectSSE(run_id);
    await refreshRunList();
  }catch(e){
    toast('Error: '+e.message,'red');
    setRunBtn(false);
  }
}

function connectSSE(runId){
  if(currentEs){ currentEs.close(); }
  const es = new EventSource(`/events/${runId}`);
  currentEs = es;
  es.onmessage = e => handleEvent(JSON.parse(e.data));
  es.onerror = () => { es.close(); };
}

function handleEvent(ev){
  switch(ev.type){
    case 'agent_start':
      agentStates[ev.agent] = {status:'running'};
      statAgents++;
      updateNode(ev.agent,'running');
      appendLog(ev.agent,'agent_start',`▶ Starting…`);
      break;
    case 'log':
      appendLog(ev.agent,'log',ev.message);
      break;
    case 'artifact':
      statFiles++;
      updateStat('stat-files',statFiles);
      appendLog(ev.agent,'artifact','📦 '+ev.filename);
      addArtifact({path:ev.path, name:ev.filename, ext:(ev.filename||'').match(/\.[^.]+$/)?.[0]||''});
      break;
    case 'agent_done':
      agentStates[ev.agent] = {status:ev.status, elapsed:ev.elapsed, summary:ev.summary};
      updateNode(ev.agent, ev.status==='ok'?'done':'error', ev.elapsed);
      appendLog(ev.agent,'agent_done '+(ev.status==='ok'?'ok':'error'),
        (ev.status==='ok'?'✓ ':'✗ ')+(ev.summary||'')+'  ('+ev.elapsed+'s)', );
      updateStat('stat-agents',statAgents);
      break;
    case 'done':
      onPipelineDone(ev);
      break;
  }
}

function onPipelineDone(ev){
  stopTimer();
  setRunBtn(false);
  if(ev.status==='ok'){
    setStatus('done','Pipeline complete');
    appendLog('System','agent_done ok','🎉 All done! Check the Artifacts panel.');
    toast('Pipeline completed successfully!','green');
  } else {
    setStatus('error','Pipeline error: '+(ev.error||''));
    appendLog('System','agent_done error','✗ '+(ev.error||'Pipeline failed'));
    toast('Pipeline error: '+(ev.error||''),'red');
  }
  updateStat('stat-status', ev.status==='ok'?'OK':'ERR');
  document.getElementById('stats-bar').style.display='flex';
  refreshRunList();
}

// ═══════════════════════════════════════════════════════════════════════════
//  Pipeline visualization
// ═══════════════════════════════════════════════════════════════════════════
function renderPipeline(){
  const graph = document.getElementById('pipeline-graph');
  graph.innerHTML='';

  // Group agents by phase
  const phases = {};
  PIPELINE_DEF.forEach(a=>{ (phases[a.phase]=phases[a.phase]||[]).push(a); });

  const phaseNums = Object.keys(phases).map(Number).sort((a,b)=>a-b);
  phaseNums.forEach((ph,i)=>{
    if(i>0){
      const conn = document.createElement('div');
      conn.className='phase-connector';
      conn.textContent='→';
      graph.appendChild(conn);
    }
    const phaseEl = document.createElement('div');
    phaseEl.className='pipeline-phase';
    const lbl = ['Plan','Arch','Implement','QA'][ph]||`Ph${ph}`;
    phaseEl.innerHTML=`<div class="phase-label">${lbl}</div><div class="phase-nodes" id="phase-nodes-${ph}"></div>`;
    graph.appendChild(phaseEl);
  });

  PIPELINE_DEF.forEach(a=>{
    const nodesEl = document.getElementById(`phase-nodes-${a.phase}`);
    if(!nodesEl) return;
    const node = document.createElement('div');
    node.className='agent-node';
    node.id='node-'+a.id;
    node.title=a.id;
    node.innerHTML=`
      <div class="agent-icon">${a.icon}</div>
      <div class="agent-name">${a.label}</div>
      <div class="agent-status-dot"></div>
      <div class="agent-elapsed" id="elapsed-${a.id}"></div>`;
    nodesEl.appendChild(node);
  });
}

function updateNode(agentName, status, elapsed){
  const node = document.getElementById('node-'+agentName);
  if(!node) return;
  node.className='agent-node '+status;
  if(elapsed){ document.getElementById('elapsed-'+agentName).textContent=elapsed+'s'; }
}

// ═══════════════════════════════════════════════════════════════════════════
//  Logs
// ═══════════════════════════════════════════════════════════════════════════
function appendLog(agent, type, msg){
  const scroll = document.getElementById('log-scroll');
  const atBottom = scroll.scrollHeight - scroll.clientHeight - scroll.scrollTop < 40;

  if(scroll.children.length===1 && scroll.children[0].tagName!=='DIV'.toLowerCase()){
    scroll.innerHTML=''; // remove placeholder
  } else if(scroll.children.length===1 && scroll.children[0].style && scroll.children[0].style.textAlign==='center'){
    scroll.innerHTML='';
  }

  const ts = new Date().toTimeString().slice(0,8);
  const agentDef = PIPELINE_DEF.find(a=>a.id===agent)||{badgeClass:'badge-producer'};
  const badgeClass = agentDef.badgeClass||'badge-producer';

  const entry = document.createElement('div');
  entry.className='log-entry '+type.replace(/\s+/g,' ');
  entry.innerHTML=`
    <span class="log-ts">${ts}</span>
    <span class="log-agent ${badgeClass}">${(agent||'').replace('Agent','')}</span>
    <span class="log-msg">${escHtml(msg)}</span>`;
  scroll.appendChild(entry);

  // Limit to 600 lines
  while(scroll.children.length > 600){ scroll.removeChild(scroll.firstChild); }
  if(atBottom){ scroll.scrollTop = scroll.scrollHeight; }
}

function clearLogs(){
  document.getElementById('log-scroll').innerHTML=
    '<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center">Cleared.</div>';
}

// ═══════════════════════════════════════════════════════════════════════════
//  Artifacts
// ═══════════════════════════════════════════════════════════════════════════
let artifactMap = {};   // path → item

function addArtifact(item){
  if(artifactMap[item.path]) return;
  artifactMap[item.path] = item;
  renderArtifacts();
}

function renderArtifacts(){
  const list = Object.values(artifactMap);
  const count = list.length;
  document.getElementById('artifact-count').textContent = count+' file'+(count!==1?'s':'');

  // Group by directory
  const groups = {};
  list.forEach(a=>{
    const dir = a.path.split('/').slice(-2,-1)[0]||'root';
    (groups[dir]=groups[dir]||[]).push(a);
  });

  const el = document.getElementById('artifact-list');
  el.innerHTML='';

  Object.keys(groups).sort().forEach(dir=>{
    const div = document.createElement('div');
    div.className='artifact-divider';
    div.textContent='📁 '+dir;
    el.appendChild(div);
    groups[dir].forEach(a=>{
      const icon = EXT_ICON[a.ext]||EXT_ICON.default;
      const size = a.size>1024 ? (a.size/1024).toFixed(1)+'KB' : (a.size||'')+'B';
      const item = document.createElement('div');
      item.className='artifact-item';
      item.dataset.path=a.path;
      item.innerHTML=`<span class="artifact-icon">${icon}</span><span class="artifact-name">${a.name}</span><span class="artifact-size">${size}</span>`;
      item.onclick=()=>previewFile(a, item);
      el.appendChild(item);
    });
  });
}

async function previewFile(artifact, itemEl){
  document.querySelectorAll('.artifact-item').forEach(e=>e.classList.remove('active'));
  itemEl.classList.add('active');
  document.getElementById('preview-filename').textContent = artifact.name;

  const body = document.getElementById('preview-body');
  body.innerHTML='<div style="padding:12px;color:var(--muted);font-size:12px">Loading…</div>';

  const ext = artifact.ext;

  if(['.png','.jpg','.jpeg','.gif','.webp'].includes(ext)){
    body.innerHTML=`<img src="/api/artifact?path=${encodeURIComponent(artifact.path)}" alt="${artifact.name}"/>`;
    return;
  }
  if(['.mp3','.wav','.ogg'].includes(ext)){
    body.innerHTML=`<audio controls src="/api/artifact?path=${encodeURIComponent(artifact.path)}"></audio>`;
    return;
  }

  const data = await api.getArtifact(artifact.path);
  if(!data){ body.innerHTML='<div style="padding:12px;color:var(--red)">Failed to load</div>'; return; }

  const lang = EXT_LANG[ext]||'';
  const escaped = escHtml(data.content||'');
  const cls = lang ? `language-${lang}` : '';
  body.innerHTML=`<pre><code class="${cls}">${escaped}</code></pre>`;
  if(lang && window.Prism){ Prism.highlightAllUnder(body); }
}

// ═══════════════════════════════════════════════════════════════════════════
//  Run history
// ═══════════════════════════════════════════════════════════════════════════
async function refreshRunList(){
  const runs = await api.getRuns().catch(()=>[]);
  const el = document.getElementById('run-list');
  el.innerHTML='';
  [...runs].reverse().forEach(r=>{
    const item = document.createElement('div');
    item.className='run-item'+(r.id===currentRunId?' active':'');
    item.innerHTML=`
      <div class="run-item-goal">${escHtml(r.goal)}</div>
      <div class="run-item-meta">
        <span class="run-item-id">#${r.id}</span>
        <span class="run-chip ${r.status}">${r.status}</span>
      </div>`;
    item.onclick=()=>loadRun(r.id);
    el.appendChild(item);
  });
}

async function loadRun(runId){
  if(runId===currentRunId) return;
  if(currentEs){ currentEs.close(); currentEs=null; }
  currentRunId=runId;
  resetState();
  renderPipeline();

  // Replay events from history
  const events = await fetch(`/events/${runId}`).then(()=>null).catch(()=>null);
  // Load artifacts
  const artData = await api.getArtifacts(runId).catch(()=>({artifacts:[]}));
  artData.artifacts.forEach(a=>addArtifact(a));

  // Re-subscribe SSE (will replay history automatically)
  connectSSE(runId);
  document.querySelectorAll('.run-item').forEach(el=>{
    el.classList.toggle('active', el.querySelector('.run-item-id').textContent==='#'+runId);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
//  Helpers
// ═══════════════════════════════════════════════════════════════════════════
function resetState(){
  agentStates={};
  artifactMap={};
  artifacts=[];
  statFiles=0; statAgents=0;
  updateStat('stat-files',0);
  updateStat('stat-agents',0);
  updateStat('stat-time','—');
  updateStat('stat-status','—');
  document.getElementById('artifact-list').innerHTML=
    '<div style="color:var(--muted);font-size:12px;padding:20px;text-align:center">Generated files appear here.</div>';
  document.getElementById('artifact-count').textContent='No files yet';
}

function setRunBtn(isRunning){
  const btn=document.getElementById('run-btn');
  const icon=document.getElementById('btn-icon');
  const lbl=document.getElementById('btn-label');
  btn.disabled=isRunning;
  icon.innerHTML=isRunning?'<span class="spinner"></span>':'▶';
  lbl.textContent=isRunning?'Running…':'Run Pipeline';
}

function setStatus(type,text){
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-text');
  dot.className='status-dot '+(type==='running'?'running':type==='done'?'done':type==='error'?'error':'');
  txt.textContent=text;
}

function updateStat(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }

function startTimer(){
  stopTimer();
  timerInterval=setInterval(()=>{
    const elapsed=((Date.now()-runStart)/1000).toFixed(0);
    updateStat('stat-time',elapsed+'s');
    document.getElementById('stats-bar').style.display='flex';
  },1000);
}
function stopTimer(){ if(timerInterval){ clearInterval(timerInterval); timerInterval=null; } }

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function toast(msg, type=''){
  const el=document.createElement('div');
  el.className='toast';
  el.style.borderColor = type==='green'?'var(--green)':type==='red'?'var(--red)':type==='amber'?'var(--amber)':'var(--border2)';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

// ═══════════════════════════════════════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════════════════════════════════════
(async()=>{
  renderPipeline();
  await refreshRunList();
  // Keyboard shortcut: Ctrl+Enter to run
  document.getElementById('idea').addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ startRun(); }
  });
})();

</script>
